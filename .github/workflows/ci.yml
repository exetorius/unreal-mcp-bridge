name: CI

# Runs on every push to a long-lived branch and on every pull request into one,
# including pull requests from forks — which is the only way an outside
# contributor can reach this repo, so their work gets the same checks mine does.
on:
  push:
    branches: [main, contrib]
  pull_request:
    branches: [main, contrib]

# Read-only. A fork's pull request must never be able to write to this repo.
permissions:
  contents: read

# A new push to the same branch/PR supersedes the run already in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.16.6
      - name: ruff check
        # Settings come from pyproject.toml, so this is the same command a
        # contributor runs locally and gets the same answer.
        run: ruff check --output-format=github .

  compile:
    name: Compile & import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is 3.10: mcp_bridge.py uses PEP 604 `X | None` in function
        # signatures with no `from __future__ import annotations`, so those
        # annotations are evaluated at def time and 3.9 raises TypeError.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q mcp_bridge.py
      - name: Import cleanly
        # The bridge must import with no side effects: module scope is constants
        # and a lock, and main() is behind `if __name__ == "__main__"`. If an
        # import ever opens a socket or blocks, this step catches it.
        run: python -c "import mcp_bridge; print('import OK')"

  smoke:
    name: Smoke (no editor required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run smoke tests
        # Drives the real bridge process against a deliberately closed port:
        # it must survive an absent editor, exit cleanly when stdin closes, and
        # still answer `initialize` from its cold-start cache. Stdlib only.
        run: python tests/smoke_test.py

  # Single job to point a branch rule at later: it goes green only if all do.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, compile, smoke]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          echo "lint=${{ needs.lint.result }} compile=${{ needs.compile.result }} smoke=${{ needs.smoke.result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.compile.result }}" = "success" ] \
            && [ "${{ needs.smoke.result }}" = "success" ]
