name: CI

# Runs on every push to a long-lived branch and on every pull request into one,
# including pull requests from forks — which is the only way an outside
# contributor can reach this repo, so their work gets the same checks mine does.
on:
  push:
    branches: [main, contrib]
  pull_request:
    branches: [main, contrib]

# Read-only. A fork's pull request must never be able to write to this repo.
permissions:
  contents: read

# A new push to the same branch/PR supersedes the run already in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.16.6
      - name: ruff check
        # Settings come from pyproject.toml, so this is the same command a
        # contributor runs locally and gets the same answer.
        run: ruff check --output-format=github .

  compile:
    name: Compile & import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is 3.10: mcp_bridge.py uses PEP 604 `X | None` in function
        # signatures with no `from __future__ import annotations`, so those
        # annotations are evaluated at def time and 3.9 raises TypeError.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q mcp_bridge.py
      - name: Import cleanly
        # The bridge must import with no side effects: module scope is constants
        # and a lock, and main() is behind `if __name__ == "__main__"`. If an
        # import ever opens a socket or blocks, this step catches it.
        run: python -c "import mcp_bridge; print('import OK')"

  smoke:
    name: Smoke (no editor required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run smoke tests
        # Drives the real bridge process against a deliberately closed port:
        # it must survive an absent editor, exit cleanly when stdin closes, and
        # still answer `initialize` from its cold-start cache. Stdlib only.
        run: python tests/smoke_test.py

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    env:
      # Pinned, not `main`: this downloads and executes a binary in CI, so the
      # version and its checksum are reviewed like any other dependency.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint
        run: |
          set -euo pipefail
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$file" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${file}"
          echo "${ACTIONLINT_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" actionlint
      - name: Assert shellcheck is available
        # actionlint exits 0 when shellcheck is missing — it just silently skips
        # the `run:` block checks, which are the ones with no other gate here.
        # A green result would then prove nothing, so fail loudly instead.
        run: shellcheck --version
      - name: actionlint
        # Checks workflow schema, expression syntax and action references, and
        # runs shellcheck over every `run:` block, since both workflows embed
        # bash with nested heredocs. shellcheck is preinstalled on ubuntu
        # runners and actionlint picks it up from PATH.
        run: ./actionlint -color

  # Single job to point a branch rule at later: it goes green only if all do.
  #
  # NOTE: the name "CI" is load-bearing. The protect-default-branch ruleset
  # requires a status check with this exact context, matched by string, and
  # nothing connects the two. Rename or remove this job and the required check
  # never reports: pull requests do not go red, they sit forever on "Expected —
  # Waiting for status to be reported" and become unmergeable. If you change the
  # name, update the ruleset in the same change.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, compile, smoke, workflows]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          echo "lint=${{ needs.lint.result }} compile=${{ needs.compile.result }}" \
               "smoke=${{ needs.smoke.result }} workflows=${{ needs.workflows.result }}"
          [ "${{ needs.lint.result }}" = "success" ] \
            && [ "${{ needs.compile.result }}" = "success" ] \
            && [ "${{ needs.smoke.result }}" = "success" ] \
            && [ "${{ needs.workflows.result }}" = "success" ]
